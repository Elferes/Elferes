name: Datos de gráficas Deriv

# El orquestador sube trading/solicitudes/datos.txt al empezar; esto descarga las gráficas
# (15m, 1h, diario, semanal, mensual, anual) a trading/datos/ en ~1 minuto.
on:
  push:
    paths:
      - "trading/solicitudes/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos-deriv
  cancel-in-progress: false

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install websockets==13.1

      - name: Exportar gráficas
        env:
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
          DERIV_APP_ID: ${{ vars.DERIV_APP_ID || secrets.DERIV_APP_ID }}
        run: python trading/ejecutor/exportar_datos.py

      - name: Guardar en el repositorio
        run: |
          git config user.name "datos-deriv"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trading/datos
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Datos de gráficas $(TZ=America/Bogota date +%F_%H:%M)"
          for i in 1 2 3 4; do
            git pull --no-rebase --no-edit origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep $((i * 5))
          done
