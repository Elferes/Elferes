name: Backtest de estrategias y patrones

# Se lanza al subir trading/solicitudes/backtest.txt (lo hace el investigador-estrategias) o a mano.
on:
  push:
    paths:
      - "trading/solicitudes/backtest.txt"
  workflow_dispatch:
    inputs:
      activos:
        description: "Activos separados por coma (vacío = todos)"
        required: false
        default: ""
      temporalidades:
        description: "5m,15m,1h (vacío = todas)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pruebas
        run: python -m unittest trading/ejecutor/test_estrategias.py

      - name: Backtest
        env:
          ACTIVOS: ${{ inputs.activos }}
          TFS: ${{ inputs.temporalidades }}
        run: |
          args=""
          if [ -n "$ACTIVOS" ]; then args="$args --activos $ACTIVOS"; fi
          if [ -n "$TFS" ]; then args="$args --temporalidades $TFS"; fi
          python trading/ejecutor/backtest.py $args

      - name: Guardar en el repositorio
        if: always()
        run: |
          git config user.name "backtest"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trading/estrategias || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Backtest $(TZ=America/Bogota date +%F_%H:%M)"
          for i in 1 2 3 4; do
            git pull --no-rebase --no-edit origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && break
            sleep $((i * 5))
          done
